[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "thumbor-plugins-gifv"
version = "0.1.5"
description = "Thumbor optimizer to add support to Gifv(mp4)"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Guilherme Souza", email = "guilherme@souza.tech" }]
keywords = ["thumbor", "ffmpeg", "gifv", "mp4"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Multimedia :: Graphics :: Presentation",
]
dependencies = [
    "thumbor>=7",
    "webcolors>=1.13",
]

[project.readme]
content-type = "text/markdown"
text = """
# thumbor-plugins-gifv

Converts GIF requests whose filter chain contains `gifv` into MP4 or WebM with `ffmpeg`.

Settings: `FFMPEG_PATH`, `FFMPEG_TIMEOUT`.

This package is part of the thumbor-plugins repository:
https://github.com/thumbor/thumbor-plugins
"""

[project.urls]
Homepage = "https://github.com/thumbor/thumbor-plugins"
Changelog = "https://github.com/thumbor/thumbor-plugins/blob/master/thumbor_plugins/optimizers/gifv/CHANGELOG.md"

[tool.setuptools]
packages = ["thumbor_plugins.optimizers.gifv"]

[tool.setuptools.package-dir]
"thumbor_plugins.optimizers.gifv" = "."
