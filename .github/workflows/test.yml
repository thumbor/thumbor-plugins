name: Run tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  list_test_subjects:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: set-matrix
        run: echo "matrix=$(find . -type f -name 'Dockerfile' | awk -F/ '{print $3"/"$4}' | jq -Rsc '. / "\n" - [""]')" >> "$GITHUB_OUTPUT"
  test:
    name: ${{ matrix.subject }}
    runs-on: ubuntu-latest
    needs: list_test_subjects
    strategy:
      fail-fast: false
      matrix:
        subject: ${{ fromJSON(needs.list_test_subjects.outputs.matrix) }}
    env:
      SUBJECT: ${{ matrix.subject }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: build-test-image
        run: docker build -t test_image -f "thumbor_plugins/$SUBJECT/tests/docker/Dockerfile" .
      - id: run-tests
        run: |
          MODULE="thumbor_plugins.${SUBJECT////.}"
          docker run --rm -v "$(pwd):/app" test_image /bin/bash -c "pip install -r test_requirements.txt && pip install -e thumbor_plugins/$SUBJECT && pytest --cov=$MODULE thumbor_plugins/$SUBJECT/tests && coverage lcov"
      - name: Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.lcov
          format: lcov
          flag-name: run-${{ matrix.subject }}
          parallel: true
  finish:
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
