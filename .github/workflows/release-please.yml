on:
  push:
    branches:
      - master
name: release-please

permissions:
  contents: read

jobs:
  list_modules:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: set-matrix
        run: echo "matrix=$(find . -type f -name 'Dockerfile' | awk -F/ '{print $3"/"$4}' | jq -Rsc '. / "\n" - [""]')" >> "$GITHUB_OUTPUT"
  release-please:
    name: release-${{ matrix.subject }}
    runs-on: ubuntu-latest
    needs: list_modules
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        subject: ${{ fromJSON(needs.list_modules.outputs.matrix) }}
    env:
      SUBJECT: ${{ matrix.subject }}
    steps:
      - name: Set environment
        run: echo "PACKAGE_NAME=thumbor-plugins-${SUBJECT#*/}" >> "$GITHUB_ENV"
      - uses: google-github-actions/release-please-action@db8f2c60ee802b3748b512940dde88eabd7b7e01 # v3.7.13
        id: release
        with:
          monorepo-tags: true
          release-type: python
          path: thumbor_plugins/${{ matrix.subject }}
          package-name: ${{ env.PACKAGE_NAME }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.release.outputs.releases_created }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: ${{ steps.release.outputs.releases_created }}
        with:
          python-version: '3.x'
      - name: Build package
        if: ${{ steps.release.outputs.releases_created }}
        working-directory: ./thumbor_plugins/${{ matrix.subject }}
        run: |
          pip install -U pip
          pip install -U build
          python -m build
      - name: Publish a Python distribution to PyPI
        if: ${{ steps.release.outputs.releases_created }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: thumbor_plugins/${{ matrix.subject }}/dist
          skip-existing: true
