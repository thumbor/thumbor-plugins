version: 2
updates:
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/thumbor_plugins/optimizers/*"
    schedule:
      interval: "daily"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "docker"
    directories:
      - "/thumbor_plugins/optimizers/*/tests/docker"
    schedule:
      interval: "daily"
